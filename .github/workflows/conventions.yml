name: conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

env:
  KINDS: feat|fix|ref|hotfix|docs|ci|chore|test|perf|build|revert

jobs:
  naming:
    name: branch and commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -Eq "^(${KINDS})/[a-z0-9][a-z0-9._-]*$"; then
            echo "::error::branch '$BRANCH' should be <kind>/<subject>, lower case,"
            echo "::error::with kind one of: ${KINDS//|/, }"
            exit 1
          fi

      # The merge is a squash, so the title of the pull request is the
      # subject of the commit that lands on main.
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          ./scripts/check-subject.sh "$TITLE" "pull request title"

      - name: Commit subjects
        env:
          BASE: ${{ github.base_ref }}
        run: |
          failed=0
          while IFS= read -r subject; do
            ./scripts/check-subject.sh "$subject" "commit" || failed=1
          done < <(git log --no-merges --format=%s "origin/$BASE..HEAD")
          exit $failed
