name: retry

# GitHub refuses a macOS runner about half the time on this repository, and
# a job it never hands out is cancelled with no runner attached. That is a
# distinct signal from a job that ran and failed, so it can be retried
# without papering over a real failure.
on:
  workflow_run:
    workflows: [ci, release]
    types: [completed]

permissions:
  actions: write

jobs:
  lost-runners:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Retry only jobs that never got a machine
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          lost=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" --paginate \
            --jq '[.jobs[] | select(.conclusion == "cancelled" and (.runner_name // "") == "")] | length')
          ran_and_failed=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" --paginate \
            --jq '[.jobs[] | select(.conclusion == "failure")] | length')

          echo "jobs that never got a machine: $lost"
          echo "jobs that ran and failed: $ran_and_failed"

          if [ "$lost" -gt 0 ] && [ "$ran_and_failed" -eq 0 ]; then
            echo "retrying $RUN once"
            gh api -X POST "repos/$REPO/actions/runs/$RUN/rerun-failed-jobs"
          else
            echo "nothing to retry: a failure here is a real one"
          fi
